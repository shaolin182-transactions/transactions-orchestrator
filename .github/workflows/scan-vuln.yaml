name: Security Scan (Trivy)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or tag to scan"
        required: true
        default: "main"
        type: string


permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  dispatch-and-wait:
    strategy:
      matrix:
        include:
          - repo: "transactions-java"
            workflow: "vulnerability-scan.yaml"

    uses: shaolin182-transactions/transactions-java/.github/workflows/vulnerability-scan.yaml@07f8919b803299de8bc5e7a9a7d8e75c11008c48

          
        


